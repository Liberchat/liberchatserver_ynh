# WebSocket proxy for socket.io (must be before main location)
location __PATH__/socket.io/ {
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    
    # Bypass SSO for WebSocket connections
    access_log off;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Hide existing CSP headers from upstream
    proxy_hide_header Content-Security-Policy;
    
    # Set our own CSP that allows WebSockets - use 'set' to override completely
    set $csp_policy "default-src 'self' https: data: blob:; connect-src 'self' https: wss: ws: wss://$host; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data: blob: https:; media-src 'self' data: blob:; frame-src *;";
    add_header Content-Security-Policy $csp_policy always;
    
    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}
