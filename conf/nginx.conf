# WebSocket proxy for socket.io (must be before main location)
location __PATH__/socket.io/ {
    rewrite ^__PATH__/socket.io/(.*) /socket.io/$1 break;
    proxy_pass http://127.0.0.1:__PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade "websocket";
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    
    # Bypass SSO for WebSocket connections
    access_log off;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade "websocket";
    proxy_set_header Connection "Upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Override CSP to allow WebSockets
    proxy_hide_header Content-Security-Policy;
    add_header Content-Security-Policy "default-src 'self' https: data: blob:; connect-src 'self' https: wss: ws:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https:; img-src * data: blob: 'unsafe-inline'; font-src 'self' https: data:; object-src 'none'; base-uri 'self';" always;
    
    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}
