# Configuration pour Socket.IO (WebSocket + HTTP polling)
# NOTE: Cette configuration ajoute une `map` utile pour relayer correctement le header Connection.
# La directive `map` doit idéalement être placée dans le contexte `http` du fichier nginx principal.
# Si ce template est injecté dans un bloc `http` déjà existant, gardez ceci. Sinon, copiez le bloc `map`
# dans la configuration globale nginx (contexte http) du serveur.

# map pour relayer correctement Connection selon $http_upgrade (upgrade => 'upgrade', sinon 'close')
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# API routes bypass SSO (must be before main location)
location __PATH__/api/ {
    proxy_pass http://127.0.0.1:__PORT__/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
    
    # Bypass SSO for API routes
    access_log off;
}

# Socket.IO proxy (handles both HTTP polling and WebSocket)
location __PATH__/socket.io/ {
    # Preserve base path so forwarded request path matches server socket.io path
    proxy_pass http://127.0.0.1:__PORT____PATH__/socket.io/;
    proxy_http_version 1.1;
    
    # Headers pour WebSocket ET HTTP polling
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Configuration pour Socket.IO
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 60;
    proxy_buffering off;
    proxy_request_buffering off;
    
    # CORS headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization' always;
    
    # Handle preflight requests
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*';
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
        add_header 'Access-Control-Allow-Headers' 'Origin, X-Requested-With, Content-Type, Accept, Authorization';
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain; charset=utf-8';
        add_header 'Content-Length' 0;
        return 204;
    }
    
    # Bypass SSO for Socket.IO
    access_log off;
}

location __PATH__/ {
    proxy_pass http://127.0.0.1:__PORT__/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    
    # Include SSOWAT user panel.
    include conf.d/yunohost_panel.conf.inc;
}