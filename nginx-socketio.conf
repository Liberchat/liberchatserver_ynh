# Configuration nginx pour Socket.IO avec YunoHost
# À placer dans le fichier de configuration nginx de l'application

# Configuration spécifique pour Socket.IO
location __PATH__/socket.io/ {
    # Preserve the base path when proxying to the app so the server receives
    # the same request path (e.g. /liberchat/socket.io/ -> /liberchat/socket.io/)
    proxy_pass http://127.0.0.1:__PORT____PATH__/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $server_name;
    
    # Timeouts spécifiques pour Socket.IO
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Désactiver le buffering pour les WebSockets
    proxy_buffering off;
    proxy_cache off;
    
    # Headers CORS pour Socket.IO
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
    add_header Access-Control-Allow-Credentials "true" always;
}

# Configuration pour les requêtes OPTIONS (CORS preflight)
location __PATH__/socket.io/ {
    if ($request_method = 'OPTIONS') {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }
}